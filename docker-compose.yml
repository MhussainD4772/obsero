services:
 # service name = hostname other containers will use!!
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obsero
      POSTGRES_PASSWORD: obsero
      POSTGRES_DB: obsero
    ports:
      - "5433:5432"  # host 5433 → container 5432 (avoids local Postgres on 5432)
    volumes:
      - postgres_data:/var/lib/postgresql/data # named vloume: db files live outside the container file system

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://obsero:obsero@postgres:5432/obsero
    volumes:
      # Host backend/ → container /app (matches WORKDIR in Dockerfile)
      - ./backend:/app
    # Migrate then serve (entrypoint is bind-mounted from ./backend)
    command: ["sh", "entrypoint.sh"]
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Preserve Linux node_modules from the image; don't let Mac mount overwrite them
      - /app/node_modules
    environment:
      # Optional but useful: Next picks up file changes more reliably in Docker on Mac
      - WATCHPACK_POLLING=true


# Top-level volumes block declares named volumes used above
volumes:
  postgres_data: