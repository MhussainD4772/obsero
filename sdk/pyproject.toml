[project]
name = "obsero"
version = "0.1.0"
description = "Obsero Python SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsero"]